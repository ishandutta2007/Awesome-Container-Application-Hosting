<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Dynamic Animated Elements */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-card1 { animation: float1 6s ease-in-out infinite; }
    .animated-card2 { animation: float2 8s ease-in-out infinite; }
    .animated-pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    .flowing-line { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Grid Lines (Background Graphic Element) -->
  <g opacity="0.15">
    <path d="M0,80 H1200 M0,160 H1200 M0,240 H1200 M0,320 H1200" stroke="#38bdf8" stroke-width="1" />
    <path d="M200,0 V400 M400,0 V400 M600,0 V400 M800,0 V400 M1000,0 V400" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="200" cy="100" r="150" fill="#38bdf8" opacity="0.1" filter="url(#glow)" class="animated-pulse" />
  <circle cx="1000" cy="300" r="180" fill="#c084fc" opacity="0.1" filter="url(#glow)" class="animated-pulse" />

  <!-- Background Animated Floating Cards / Visual Elements (Positioned away from text) -->
  <g class="animated-card1">
    <!-- Container Pill Floating Graphic Top Right -->
    <rect x="920" y="50" width="220" height="70" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
    <circle cx="950" cy="85" r="12" fill="#38bdf8" opacity="0.8" />
    <path d="M945 85 L950 90 L958 80" stroke="#0f172a" stroke-width="2" fill="none" />
    <text x="975" y="80" font-family="sans-serif" font-weight="600" font-size="14" fill="#f8fafc">Docker &amp; K8s</text>
    <text x="975" y="98" font-family="sans-serif" font-size="12" fill="#94a3b8">Auto-Scaled</text>
  </g>

  <g class="animated-card2">
    <!-- Serverless Container Pill Floating Bottom Right -->
    <rect x="880" y="270" width="240" height="75" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" opacity="0.8" />
    <rect x="900" y="295" width="28" height="25" rx="4" fill="#818cf8" opacity="0.8" />
    <text x="940" y="305" font-family="sans-serif" font-weight="600" font-size="14" fill="#f8fafc">Scale to Zero</text>
    <text x="940" y="325" font-family="sans-serif" font-size="12" fill="#38bdf8">GitOps &amp; One-Click PaaS</text>
  </g>

  <!-- Flowing Connection Lines -->
  <path d="M 800 200 Q 880 120 920 85" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.4" class="flowing-line" />
  <path d="M 800 200 Q 840 280 880 305" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.4" class="flowing-line" />

  <!-- Decorative Top Bar Gradient -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)" />

  <!-- FOREGROUND CONTENT: Header Text & Details (Guaranteed Clear Foreground Visibility) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="32" y="21" class="badge-text">COMMERCIAL &amp; OPEN-SOURCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">Awesome Container Application Hosting 🚢</text>

    <!-- Subtitle / Description -->
    <text x="0" y="215" class="subtitle">Curated Directory of Cloud PaaS, Serverless Containers &amp; Self-Hosted Deployment Platforms</text>

    <!-- Feature Tag Chips -->
    <g transform="translate(0, 260)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="150" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="18" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">⚡ Scale-To-Zero</text>

      <!-- Chip 2 -->
      <rect x="162" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="180" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">🚀 Git-Push Deploy</text>

      <!-- Chip 3 -->
      <rect x="339" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="357" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">🐳 Self-Hosted PaaS</text>

      <!-- Chip 4 -->
      <rect x="511" y="0" width="170" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="529" y="23" font-family="sans-serif" font-size="14" font-weight="600" fill="#cbd5e1">🔒 Private &amp; Managed</text>
    </g>
  </g>
</svg>
