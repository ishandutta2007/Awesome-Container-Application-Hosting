<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes float1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes float2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1deg)}}@keyframes pulse{0%{opacity:.3;transform:scale(.98)}50%{opacity:.7;transform:scale(1.02)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8}.animated-card1{animation:float1 6s ease-in-out infinite}.animated-card2{animation:float2 8s ease-in-out infinite}.animated-pulse{animation:pulse 4s ease-in-out infinite;transform-origin:center}.flowing-line{stroke-dasharray:8 8;animation:dash 2s linear infinite}</style><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g opacity=".15"><path stroke="#38bdf8" stroke-width="1" d="M0,80 H1200 M0,160 H1200 M0,240 H1200 M0,320 H1200"/><path stroke="#38bdf8" stroke-width="1" d="M200,0 V400 M400,0 V400 M600,0 V400 M